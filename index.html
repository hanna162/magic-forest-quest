<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Forest Quest V2 (Audited)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .glass-panel { background-color: #064E3B; border: 2px solid #34D399; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-radius: 16px; }
        .tile-btn { background-color: #166534; border-bottom: 4px solid #064E3B; transition: all 0.1s; }
        .tile-btn:active { transform: translateY(4px); border-bottom: 0px; }
        @media print { body * { visibility: hidden; } }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center overflow-y-auto relative">
    <div class="fixed inset-0 bg-gradient-to-b from-green-900 to-black z-0"></div>
    <div id="app" class="relative z-10 w-full max-w-2xl p-4 my-8">
        
        <!-- START SCREEN -->
        <div id="start-screen" class="glass-panel p-8 text-center animate-float">
            <h1 class="text-4xl font-bold text-green-300 mb-2">Magic Forest Quest 🌲</h1>
            <p class="text-green-100 mb-8 font-bold">Topic: Determiners (This, That, There is, There are)</p>
            <input type="text" id="student-name" placeholder="Enter Name..." class="w-full p-4 mb-4 rounded-xl bg-green-800 border-2 border-green-500 text-center font-bold text-white placeholder-green-300">
            <button onclick="startQuest()" id="start-btn" disabled class="w-full p-4 rounded-xl bg-yellow-600 text-white font-bold opacity-50">Start Quest ⚔️</button>
            <button onclick="printWorksheet()" class="w-full p-3 mt-3 rounded-xl bg-white text-green-900 font-bold border-2 border-white">Print Worksheet 📄</button>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="hidden flex flex-col gap-4">
            <div class="glass-panel p-3 flex justify-between items-center">
                <span id="player-display" class="font-bold text-yellow-300">Player</span>
                <div class="font-bold">Score: <span id="score-display" class="text-yellow-400">0</span></div>
            </div>
            <div class="w-full bg-green-900 h-3 rounded-full overflow-hidden"><div id="timer-bar" class="h-full bg-yellow-400 w-full"></div></div>
            <div class="glass-panel p-6 min-h-[160px] flex items-center justify-center text-center relative">
                <h2 id="question-text" class="text-2xl font-bold leading-relaxed">Loading...</h2>
                <div id="explanation-box" class="hidden absolute inset-0 bg-gray-900 z-20 flex flex-col items-center justify-center p-4 border-4 border-yellow-500 rounded-xl">
                    <p class="text-yellow-400 font-bold mb-2">Grammar Tip 💡</p>
                    <p id="explanation-text" class="mb-4">Text</p>
                    <button onclick="nextQuestion()" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold">Next ➡️</button>
                </div>
            </div>
            <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </div>

        <!-- END SCREEN -->
        <div id="end-screen" class="hidden glass-panel p-8 text-center">
            <h1 class="text-3xl font-bold text-yellow-400 mb-2">Quest Complete! 🏆</h1>
            <div class="bg-green-900 p-6 rounded-xl border border-green-500 mb-6">
                <p class="text-sm">FINAL SCORE</p>
                <p class="text-6xl font-bold mb-2" id="final-score">0</p>
                <p class="text-green-200">Explorer: <span id="cert-name">Name</span></p>
            </div>
            <button onclick="location.reload()" class="w-full p-3 bg-yellow-600 font-bold rounded-xl mb-3">Play Again 🔄</button>
            <button onclick="printWorksheet()" class="w-full p-3 bg-white text-green-900 font-bold rounded-xl">Print Worksheet 📄</button>
        </div>
    </div>

    <script>
        // AUDITED DATASET (ZERO ERROR)
        const quizData = [
            {q: "_____ is my balloon here in my hand.", a: ["This", "These", "That", "Those"], c: "This", e: "Use 'This' for one object near you."},
            {q: "Look at _____ stars far away in the sky!", a: ["this", "these", "that", "those"], c: "those", e: "Use 'those' for many objects far away."},
            {q: "_____ monkeys over there are noisy.", a: ["This", "These", "That", "Those"], c: "Those", e: "Use 'Those' because the monkeys are far away."},
            {q: "Are _____ your shoes here on the mat?", a: ["this", "these", "that", "those"], c: "these", e: "Use 'these' for many objects near you."},
            {q: "_____ is a beautiful beach we are standing on.", a: ["This", "These", "That", "Those"], c: "This", e: "Use 'This' because we are here now."},
            {q: "Can you see _____ bird flying high above?", a: ["this", "these", "that", "those"], c: "that", e: "Use 'that' for one object far away."},
            {q: "_____ books on my desk are heavy.", a: ["This", "These", "That", "Those"], c: "These", e: "Use 'These' because the books are near me."},
            {q: "Is _____ your bicycle down the road?", a: ["this", "these", "that", "those"], c: "that", e: "Use 'that' because the bicycle is far away."},
            {q: "_____ cats under my chair are sleeping.", a: ["This", "These", "That", "Those"], c: "These", e: "Use 'These' for plural objects near you."},
            {q: "Wow! _____ cake on my plate is delicious.", a: ["This", "These", "That", "Those"], c: "This", e: "Use 'This' for one object near you."},
            {q: "_____ a big library in our school.", a: ["There is", "There are", "Is there", "Are there"], c: "There is", e: "Use 'There is' for one place."},
            {q: "_____ twenty students in the class.", a: ["There is", "There are", "Is there", "Are there"], c: "There are", e: "Use 'There are' for many students."},
            {q: "_____ any milk left in the fridge?", a: ["There is", "There are", "Is there", "Are there"], c: "Is there", e: "Use 'Is there' for questions about uncountable things."},
            {q: "_____ no cars on the street tonight.", a: ["There is", "There are", "Is there", "Are there"], c: "There are", e: "Use 'There are' because 'cars' is plural."},
            {q: "_____ a playground near your house?", a: ["There is", "There are", "Is there", "Are there"], c: "Is there", e: "Start with 'Is there' for a question about one thing."},
            {q: "_____ three apples on the table.", a: ["There is", "There are", "Is there", "Are there"], c: "There are", e: "Use 'There are' for plural items."},
            {q: "_____ isn't any water in the bottle.", a: ["There", "There are", "Is there", "Are there"], c: "There", e: "'There isn't' is the correct negative form."},
            {q: "_____ many children at the park?", a: ["There is", "There are", "Is there", "Are there"], c: "Are there", e: "Start with 'Are there' for plural questions."},
            {q: "_____ a mouse hiding under the sofa.", a: ["There is", "There are", "Is there", "Are there"], c: "There is", e: "Use 'There is' for one animal."},
            {q: "_____ many clouds in the sky today.", a: ["There is", "There are", "Is there", "Are there"], c: "There are", e: "Use 'There are' for plural clouds."}
        ];

        let qIdx = 0, score = 0, timer;
        const nameInput = document.getElementById('student-name');
        const startBtn = document.getElementById('start-btn');
        nameInput.addEventListener('input', (e) => startBtn.disabled = e.target.value.trim() === "");

        function startQuest() {
            document.getElementById('player-display').textContent = nameInput.value;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQ();
        }

        function loadQ() {
            if (qIdx >= quizData.length) return endGame();
            const q = quizData[qIdx];
            document.getElementById('question-text').innerHTML = q.q.replace("_____", "<span class='text-yellow-400 border-b-2 border-yellow-400'>_____</span>");
            document.getElementById('explanation-box').classList.add('hidden');
            const grid = document.getElementById('options-grid');
            grid.innerHTML = "";
            
            resetTimer();
            q.a.sort(() => Math.random() - 0.5).forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "tile-btn w-full p-4 rounded-xl text-white font-bold text-lg hover:bg-green-700";
                btn.textContent = opt;
                btn.onclick = () => check(btn, opt, q);
                grid.appendChild(btn);
            });
        }

        function check(btn, ans, q) {
            clearInterval(timer);
            document.querySelectorAll('.tile-btn').forEach(b => b.disabled = true);
            if (ans === q.c) {
                btn.classList.replace('bg-green-700', 'bg-yellow-500');
                score += 10;
                document.getElementById('score-display').textContent = score;
                setTimeout(() => { qIdx++; loadQ(); }, 1000);
            } else {
                btn.classList.replace('bg-green-700', 'bg-red-600');
                document.getElementById('explanation-text').innerHTML = `Correct: <b>${q.c}</b><br>${q.e}`;
                document.getElementById('explanation-box').classList.remove('hidden');
            }
        }

        function nextQuestion() { qIdx++; loadQ(); }

        function resetTimer() {
            clearInterval(timer);
            let w = 100;
            const bar = document.getElementById('timer-bar');
            bar.style.width = '100%';
            timer = setInterval(() => {
                w -= 0.5; bar.style.width = w + '%';
                if (w <= 0) {
                    clearInterval(timer);
                    const q = quizData[qIdx];
                    document.getElementById('explanation-text').innerHTML = `Time's up! Correct: <b>${q.c}</b><br>${q.e}`;
                    document.getElementById('explanation-box').classList.remove('hidden');
                }
            }, 100);
        }

        function endGame() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('final-score').textContent = score;
            document.getElementById('cert-name').textContent = nameInput.value;
        }

        function printWorksheet() {
            const win = window.open('', '_blank');
            let html = `<html><head><style>body{font-family:Arial;padding:40px;}.q{margin-bottom:15px;}</style></head><body><h1 style="text-align:center">Magic Forest Worksheet</h1><p>Name: _________________</p><hr>`;
            quizData.forEach((q,i) => html += `<div class="q"><b>${i+1}.</b> ${q.q.replace('_____', '_______')}</div>`);
            html += `<br><h3>Answers</h3>`;
            quizData.forEach((q,i) => html += `${i+1}. ${q.c} `);
            html += `</body></html>`;
            win.document.write(html);
            win.document.close();
            setTimeout(() => win.print(), 500);
        }
    </script>
</body>
</html>
