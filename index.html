      {q: "There are _____ sweet strawberries in the basket.", a: ["some", "any", "much", "an"], c: "some", e: "Use 'some' for positive statements with countable plural items (strawberries)."},
      {q: "Is there _____ orange juice left in the jug?", a: ["some", "any", "many", "a"], c: "any", e: "Always use 'any' for questions when asking about uncountable amounts like juice."},

      {q: "We do not have _____ homework today.", a: ["some", "any", "many", "an"], c: "any", e: "Always use 'any' for negative sentences (sentences with 'not')."},

      {q: "My sister and mother are shopping. _____ buy dresses.", a: ["He", "She", "It", "They"], c: "They", e: "Use 'They' because it refers to multiple people excluding yourself (sister and mother)."},
      {q: "The cat is sleeping _____ the comfortable chair.", a: ["in", "on", "under", "behind"], c: "on", e: "Use 'on' because the cat is resting directly on top of the surface of the chair."},
      {q: "The fish are swimming _____ the big aquarium.", a: ["in", "on", "under", "next to"], c: "in", e: "Use 'in' because fish swim inside the enclosed space of an aquarium."},
      {q: "The puppy hid _____ the bed because it was scared.", a: ["in", "on", "under", "next to"], c: "under", e: "Use 'under' because a scared animal usually hides beneath/below a bed frame."},
      {q: "The whiteboard is _____ the teacher's desk.", a: ["in", "on", "behind", "under"], c: "behind", e: "In a classroom, the whiteboard is located at the back/behind the teacher's table."},

    ];

    const state = {
      name: "",
      questions: [],
      currentIndex: 0,
      score: 0,
      streak: 0,
      bestStreak: 0,
      multiplierReady: false,
      timer: null,
      secondsRemaining: 30,
      locked: false,
      audioContext: null
    };

    const worksheetIndexes = [0, 2, 5, 8, 10, 13, 15, 18, 20, 23, 25, 28, 30, 33, 36, 40, 43, 46, 51, 55];

    const el = {
      startScreen: document.getElementById("start-screen"),
      gameScreen: document.getElementById("game-screen"),
      endScreen: document.getElementById("end-screen"),
      studentName: document.getElementById("student-name"),
      startButton: document.getElementById("start-button"),
      startForm: document.getElementById("start-form"),
      quickPrintButton: document.getElementById("quick-print-button"),
      backHomeButton: document.getElementById("back-home-button"),
      confirmModal: document.getElementById("confirm-modal"),
      confirmExitBtn: document.getElementById("confirm-exit-btn"),
      confirmCancelBtn: document.getElementById("confirm-cancel-btn"),
      playerName: document.getElementById("player-name-display"),
      progress: document.getElementById("question-progress"),
      score: document.getElementById("score-display"),
      streak: document.getElementById("streak-display"),
      category: document.getElementById("question-category"),

      endSummary: document.getElementById("end-summary"),

      worksheetAnswers: document.getElementById("worksheet-answer-key"),

    function fisherYatesShuffle(items) {
      const shuffled = [...items];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function showScreen(screen) {
      [el.startScreen, el.gameScreen, el.endScreen].forEach(item => item.classList.remove("active"));
      screen.classList.add("active");
    }

    function categoryFor(index) {
      if (index < 10) return "Demonstratives";
      if (index < 20) return "There is / There are";
      if (index < 30) return "Short answers";
      if (index < 40) return "Quantifiers";
      if (index < 50) return "Pronouns";
      return "Prepositions";
    }

    function initAudio() {
      if (!state.audioContext) {
        state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (state.audioContext.state === "suspended") state.audioContext.resume();
    }

    function tone(frequency, duration, type, volume, delay = 0) {
      if (!state.audioContext) return;
      const ctx = state.audioContext;
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, ctx.currentTime + delay);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + delay + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);
      oscillator.connect(gain).connect(ctx.destination);
      oscillator.start(ctx.currentTime + delay);
      oscillator.stop(ctx.currentTime + delay + duration + 0.02);
    }

    function playSound(kind) {
      if (!state.audioContext) return;
      if (kind === "click") tone(420, 0.08, "sine", 0.05);
      if (kind === "correct") {
        tone(523, 0.13, "sine", 0.08);
        tone(659, 0.15, "sine", 0.08, 0.1);
        tone(784, 0.2, "triangle", 0.075, 0.21);
      }
      if (kind === "wrong") {
        tone(155, 0.22, "sawtooth", 0.075);
        tone(110, 0.25, "sawtooth", 0.055, 0.09);
      }
      if (kind === "timeout") {
        tone(300, 0.12, "square", 0.06);
        tone(220, 0.17, "square", 0.06, 0.13);
        tone(145, 0.25, "square", 0.065, 0.3);
      }
    }

    function updateHud() {
      el.progress.textContent = `${state.currentIndex + 1} / ${state.questions.length}`;
      el.score.textContent = state.score;
      el.streak.textContent = `🔥 Streak ${state.streak}${state.multiplierReady ? " · x2 ready" : ""}`;
    }

    function renderQuestion() {
      clearInterval(state.timer);
      state.secondsRemaining = 30;
      state.locked = false;

      const current = state.questions[state.currentIndex];
      el.category.textContent = categoryFor(quizData.indexOf(current));
      el.question.textContent = current.q;
      el.answerSlot.className = "answer-slot";
      el.answerSlot.innerHTML = '<span data-template-id="answer-slot-label" class="canva-text text-emerald-100/60"></span>';
      el.tileGrid.innerHTML = "";
      el.feedback.textContent = "";
      el.feedback.className = "feedback";
      el.timerBar.classList.remove("urgent");
      
      // Hide explanations & next controls for a new question
      el.explanationContainer.classList.add("hidden");
      el.nextButtonContainer.classList.add("hidden");

      fisherYatesShuffle(current.a).forEach((option) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tile focus-ring";
        button.textContent = option;
        button.addEventListener("click", () => selectAnswer(option, button));
        el.tileGrid.appendChild(button);
      });

      updateHud();
      updateTimerDisplay();
      state.timer = setInterval(() => {
        state.secondsRemaining -= 1;
        updateTimerDisplay();
        if (state.secondsRemaining <= 0) {
          clearInterval(state.timer);
          handleTimeout();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      el.timerText.textContent = `${state.secondsRemaining}s`;
      el.timerBar.style.width = `${Math.max(0, state.secondsRemaining / 30 * 100)}%`;
      el.timerBar.classList.toggle("urgent", state.secondsRemaining <= 10);
    }

    function lockTiles() {
      [...el.tileGrid.querySelectorAll("button")].forEach(button => button.disabled = true);
    }

    function putInSlot(answer, kind) {
      el.answerSlot.className = `answer-slot filled ${kind}`;
      el.answerSlot.innerHTML = `<span class="slot-answer">${answer}</span>`;
    }

    function showFireStreak() {
      el.streakBanner.classList.add("show");
      window.setTimeout(() => el.streakBanner.classList.remove("show"), 2200);
    }

    function selectAnswer(option, button) {
      if (state.locked) return;
      state.locked = true;
      clearInterval(state.timer);
      initAudio();
      playSound("click");
      lockTiles();

      const current = state.questions[state.currentIndex];
      const correct = option === current.c;
      button.classList.add("is-selected");
      putInSlot(option, correct ? "correct" : "wrong");

      if (correct) {
        button.classList.add("is-correct");
        const gained = state.multiplierReady ? 20 : 10;
        state.score += gained;
        state.multiplierReady = false;
        state.streak += 1;
        state.bestStreak = Math.max(state.bestStreak, state.streak);

        if (state.streak === 3) {
          state.multiplierReady = true;
          showFireStreak();
        }

        el.feedback.textContent = `Wonderful! +${gained} quest points`;
        el.feedback.classList.add("correct");
        playSound("correct");
        
        // Correct answer moves to next question automatically
        updateHud();
        window.setTimeout(nextQuestion, 1600);
      } else {
        button.classList.add("is-wrong");
        state.streak = 0;
        state.multiplierReady = false;
        el.feedback.textContent = `Not quite! Let's study the forest wisdom below.`;
        el.feedback.classList.add("wrong");
        playSound("wrong");

        const correctButton = [...el.tileGrid.querySelectorAll("button")].find(tile => tile.textContent === current.c);
        if (correctButton) correctButton.classList.add("is-correct");
        
        // Show explanation and the Next button for wrong answer
        el.explanationText.textContent = current.e || "Remember the grammar patterns taught by the Forest Sages!";
        el.explanationContainer.classList.remove("hidden");
        el.nextButtonContainer.classList.remove("hidden");
        updateHud();
      }
    }

    function handleTimeout() {
      if (state.locked) return;
      state.locked = true;
      initAudio();
      playSound("timeout");
      lockTiles();

      const current = state.questions[state.currentIndex];
      putInSlot(current.c, "timeout");
      const correctButton = [...el.tileGrid.querySelectorAll("button")].find(tile => tile.textContent === current.c);
      if (correctButton) correctButton.classList.add("is-correct");

      state.streak = 0;
      state.multiplierReady = false;
      el.feedback.textContent = `Time's up! Let's study the forest wisdom below.`;
      el.feedback.classList.add("timeout");
      
      // Show explanation and the Next button for timeout
      el.explanationText.textContent = current.e || "Keep an eye on the moonlight timer next time!";
      el.explanationContainer.classList.remove("hidden");
      el.nextButtonContainer.classList.remove("hidden");
      updateHud();
    }

    function nextQuestion() {
      state.currentIndex += 1;
      if (state.currentIndex >= state.questions.length) {
        finishQuest();
      } else {
        renderQuestion();
      }
    }

    function beginQuest() {
      const cleanName = el.studentName.value.trim();
      if (!cleanName) return;
      initAudio();
      playSound("click");
      state.name = cleanName;
      state.questions = fisherYatesShuffle(quizData);
      state.currentIndex = 0;
      state.score = 0;
      state.streak = 0;
      state.bestStreak = 0;
      state.multiplierReady = false;
      el.playerName.textContent = state.name;
      showScreen(el.gameScreen);
      renderQuestion();
    }

    function finishQuest() {
      clearInterval(state.timer);
      el.finalScore.textContent = state.score;
      el.finalStreak.textContent = state.bestStreak;
      el.certificateName.textContent = state.name;
      el.certificateResult.textContent = `Completed all 60 grammar challenges with ${state.score} quest points.`;
      el.endSummary.textContent = `${state.name}, you have travelled through every grammar trail in the Magic Forest!`;
      buildWorksheet();
      showScreen(el.endScreen);
    }

    function buildQuestionMarkup(question, number) {
      const printable = question.q.replace("_____", "____________________________");
      return `<div class="print-question"><strong>${number}.</strong> ${printable}<div class="hand-lines"></div></div>`;
    }

    function buildWorksheet() {
      const selected = worksheetIndexes.map(index => quizData[index]);

      const header = (pageLabel) => `
        <div class="forest-stamp">Magic Forest Quest · CEFR A1/A2 Grammar</div>
        <h1 class="print-title">Grammar Adventure Worksheet</h1>
        <div class="worksheet-meta">
          <span><strong>Name:</strong> ${escapeHtml(state.name)}</span>
          <span><strong>Teacher:</strong> Magic Forest Quest Teacher</span>
          <span>${pageLabel}</span>
        </div>
        <p style="font-size:14px;line-height:1.5;margin:0 0 10px;">Instructions: Read each sentence. Write the best word or phrase in the blank. Use neat handwriting.</p>
      `;

      el.worksheetOne.innerHTML = header("Page 1 of 3") + selected.slice(0, 10).map((q, i) => buildQuestionMarkup(q, i + 1)).join("");
      el.worksheetTwo.innerHTML = header("Page 2 of 3") + selected.slice(10, 20).map((q, i) => buildQuestionMarkup(q, i + 11)).join("");

      el.worksheetAnswers.innerHTML = `
        <div class="forest-stamp">Magic Forest Quest · Teacher Reference</div>
        <h1 class="print-title">Answer Key</h1>
        <div class="worksheet-meta">
          <span><strong>Student:</strong> ${escapeHtml(state.name)}</span>
          <span><strong>Teacher:</strong> Magic Forest Quest Teacher</span>
          <span>Page 3 of 3</span>
        </div>
        <p style="font-size:14px;line-height:1.5;">Use this page after the student has completed the worksheet.</p>
        <div style="margin-top:22px; display: flex; flex-direction: column; gap: 14px;">
          ${selected.map((q, i) => `
            <div class="answer-key-item" style="border-bottom: 1px dashed #e2e8f0; padding-bottom: 8px;">
              <strong>${i + 1}. Answer:</strong> <span style="color: #047857; font-weight: bold;">${escapeHtml(q.c)}</span>
              <p style="font-size: 13px; color: #4b5563; margin: 3px 0 0 0;"><em>Grammar Rule: ${escapeHtml(q.e || "")}</em></p>
            </div>
          `).join("")}
        </div>
      `;
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    el.studentName.addEventListener("input", () => {
      el.startButton.disabled = el.studentName.value.trim().length === 0;
    });

    el.quickPrintButton.addEventListener("click", () => {
      initAudio();
      playSound("click");
      // Fallback name if none entered yet
      const currentName = el.studentName.value.trim() || "Young Explorer";
      const savedName = state.name;
      state.name = currentName;
      buildWorksheet();
      window.print();
      state.name = savedName; // restore previous state if any
    });

    el.backHomeButton.addEventListener("click", () => {
      initAudio();
      playSound("click");
      // Stop the game timer while dialog is open
      clearInterval(state.timer);
      el.confirmModal.classList.remove("hidden");
    });

    el.confirmCancelBtn.addEventListener("click", () => {
      initAudio();
      playSound("click");
      el.confirmModal.classList.add("hidden");
      // Resume timer if not locked (game is still active)
      if (!state.locked) {
        state.timer = setInterval(() => {
          state.secondsRemaining -= 1;
          updateTimerDisplay();
          if (state.secondsRemaining <= 0) {
            clearInterval(state.timer);
            handleTimeout();
          }
        }, 1000);
      }
    });

    el.confirmExitBtn.addEventListener("click", () => {
      initAudio();
      playSound("click");
      el.confirmModal.classList.add("hidden");
      clearInterval(state.timer);
      // Reset quiz state
      state.currentIndex = 0;
      state.score = 0;
      state.streak = 0;
      state.multiplierReady = false;
      showScreen(el.startScreen);
    });

    el.startForm.addEventListener("submit", event => {
      event.preventDefault();
      beginQuest();
    });

    el.nextButton.addEventListener("click", () => {
      initAudio();
      playSound("click");
      nextQuestion();
    });

    el.restartButton.addEventListener("click", () => {
      clearInterval(state.timer);
      initAudio();
      playSound("click");
      el.studentName.value = state.name;
      el.startButton.disabled = false;
      showScreen(el.startScreen);
      el.studentName.focus();
    });

    el.printButton.addEventListener("click", () => {
      initAudio();
      playSound("click");
      buildWorksheet();
      window.print();
    });

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });
  </script>
 </body>
</html>
